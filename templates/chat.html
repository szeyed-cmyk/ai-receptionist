    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>

    <!-- Input area -->
    <div class="border-t bg-white p-3 flex-shrink-0">
      <form id="form" class="flex gap-2 items-end">
        <div id="input-wrapper" class="flex-1">
          <textarea
            id="input"
            rows="2"
            placeholder="Type a message..."
            class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none bg-gray-50"
            required
          ></textarea>
          <div id="resize-handle" title="Drag to resize window"></div>
        </div>

  <script>
    let conversationId = null;
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const container = document.getElementById("chat-container");
    const handle = document.getElementById("resize-handle");

    let isResizing = false;
    let startY, startH;

    handle.addEventListener("mousedown", (e) => {
      isResizing = true;
      startY = e.clientY;
      startH = input.offsetHeight;
      document.body.style.cursor = "ns-resize";
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
      if (!isResizing) return;
      const newH = Math.max(40, Math.min(200, startH + (e.clientY - startY)));
      input.style.height = newH + "px";
    });

    document.addEventListener("mouseup", () => {
      if (isResizing) {
        isResizing = false;
        document.body.style.cursor = "";
      }
    });

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = role === "user" ? "text-right" : "text-left";
      const bubble = document.createElement("span");
      bubble.className = `inline-block px-4 py-2.5 rounded-2xl max-w-[80%] text-sm leading-relaxed shadow-sm ${
        role === "user" 
          ? "bg-gradient-to-r from-blue-600 to-indigo-600 text-white" 
          : "bg-white text-gray-800 border border-gray-200"
      }`;
      bubble.innerHTML = text.replace(/\n/g, "<br>");
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";

      const body = new FormData();
      body.append("message", text);
      if (conversationId) body.append("conversation_id", conversationId);

      const res = await fetch("/chat", { method: "POST", body });
      const data = await res.json();
      conversationId = data.conversation_id;
      addMessage("assistant", data.reply);
    });
  </script>
</body>
</html>
