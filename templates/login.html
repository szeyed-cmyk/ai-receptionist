<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700">
  <form method="post" action="/admin/login" class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-white/20">
    <div class="flex items-center justify-center mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">A</div>
    </div>
    <h1 class="text-2xl font-bold text-center mb-1 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">Admin Login</h1>
    <p class="text-center text-sm text-gray-500 mb-6">Welcome back</p>
    {% if request.query_params.get('error') %}
      <p class="text-rose-600 text-sm mb-4 text-center bg-rose-50 px-3 py-2 rounded-lg">Invalid credentials</p>
    {% endif %}
    <input name="username" placeholder="Username" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
    <input name="password" type="password" placeholder="Password" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
    <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl hover:shadow-lg transition-all font-medium">Login</button>
  </form>
</body>
</html>
